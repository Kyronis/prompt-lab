services:
  postgres:
    image: postgres:16-alpine
    container_name: promptlab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: promptlab
    ports:
      - "5432:5432"
    volumes:
      - promptlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promptlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  promptlab_pgdata:
